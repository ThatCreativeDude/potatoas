.coolcolor {
  font-size: 24px;
  animation: color-change 3s infinite alternate;
}

@keyframes color-change {
  from {
    background: rgb(89,66,86);
  }
  to {
    background: rgb(61,56,52); 
  }
}
.animatePotato{
    animation: potato-spin 1s linear infinite;
}
@keyframes potato-spin {
  0%   { transform: perspective(150px) rotateY(0deg); }
  25%  { transform: perspective(150px) rotateY(90deg); }
  50%  { transform: perspective(150px) rotateY(180deg); }
  75%  { transform: perspective(150px) rotateY(270deg); }
  100% { transform: perspective(150px) rotateY(360deg); }
}
    }
</style>
